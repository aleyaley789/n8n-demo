include:
  - path: webapp/docker-compose.yaml
    env_file: webapp/.env

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT}:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_TYPE=sqlite
      - DB_SQLITE_VACUUM_ON_STARTUP=true
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - default
      - webapp_net
  gotify:
    image: gotify/server
    container_name: gotify
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./gotify-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  gotify-init:
    image: alpine:3.20
    depends_on:
      gotify:
        condition: service_healthy
    environment:
      - GOTIFY_APP_TOKEN=${GOTIFY_APP_TOKEN}
    volumes:
      - ./gotify-data:/data
      - ./gotify/init-app-token.sh:/init-app-token.sh:ro
    entrypoint: ["sh", "/init-app-token.sh"]

volumes:
  n8n_data:
